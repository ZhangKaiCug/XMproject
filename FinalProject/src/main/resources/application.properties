
#下面这些内容是为了让MyBatis映射
#指定Mybatis的Mapper文件
mybatis.mapper-locations=classpath:mappers/*xml
#指定Mybatis的实体目录
mybatis.type-aliases-package=com.example.FinalProject.mybatis.entity

spring.datasource.url=jdbc:mysql://localhost:3306/finalproject?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

rocketmq.name-server=127.0.0.1:9876
rocketmq.producer.group=default-producer-group
rocketmq.producer.retry-next-server=true
rocketmq.consumer.topic=signal-topic
rocketmq.consumer.group=default-consumer-group
logging.level.org.apache.rocketmq=DEBUG

server.port=8932

redis.host=127.0.0.1
redis.port= 6379
redis.password= 123456
redis.database= 0